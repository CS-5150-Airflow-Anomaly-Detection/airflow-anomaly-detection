---
name: Anomaly CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - anomaly-dev
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anomaly-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON_VERSION: "3.10"
  PLATFORM: "linux/amd64"

jobs:
  prek-checks:
    name: Prek checks
    runs-on: ["ubuntu-24.04"]
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        id: breeze
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: "Install prek"
        uses: ./.github/actions/install-prek
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          platform: ${{ env.PLATFORM }}
          save-cache: true
      - name: "Static checks (Prek)"
        run: prek --all-files --show-diff-on-failure --color always
        env:
          VERBOSE: "true"
          SKIP: ${{ inputs.skip-prek-hooks }}
          COLUMNS: "202"
          SKIP_GROUP_OUTPUT: "true"
          DEFAULT_BRANCH: ${{ inputs.branch }}
          RUFF_FORMAT: "github"
      - name: "Show prek log on failure"
        run: cat ~/.cache/prek/prek.log || true
        if: failure()

  backend-tests:
    name: Backend tests
    runs-on: ["ubuntu-24.04"]
    timeout-minutes: 60
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      # --enable-coverage adds --cov=airflow and --cov-config=pyproject.toml; the extra --cov-config
      # points at an easy-to-remove file under `.github/anomaly-ci/` which scopes tracing via [run] include.
      - name: "Run targeted backend tests (with scoped coverage)"
        run: |
          breeze testing core-tests --db-reset --enable-coverage -- \
            airflow-core/tests/unit/api_fastapi/core_api/routes/ui \
            airflow-core/tests/unit/api_fastapi/core_api/routes/public/test_task_instance_anomaly.py \
            --cov-config=.github/anomaly-ci/backend-coverage.toml \
            --cov-report=html:/opt/airflow/coverage/backend-anomaly-html \
            --cov-report=term-missing
      - name: "Upload scoped backend coverage (HTML)"
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-anomaly-coverage
          path: coverage/backend-anomaly-html
          if-no-files-found: warn

  task-sdk-tests:
    name: Task SDK tests
    runs-on: ["ubuntu-24.04"]
    timeout-minutes: 30
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: "Run task SDK tests (with scoped coverage)"
        run: |
          breeze testing task-sdk-tests --enable-coverage -- \
            task-sdk/tests/task_sdk/definitions/test_anomaly_detection.py \
            --cov-config=.github/anomaly-ci/task-sdk-coverage.toml \
            --cov-report=html:/opt/airflow/coverage/task-sdk-anomaly-html \
            --cov-report=term-missing
      - name: "Upload scoped Task SDK coverage (HTML)"
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: task-sdk-anomaly-coverage
          path: coverage/task-sdk-anomaly-html
          if-no-files-found: warn

  ui-tests:
    name: UI tests
    runs-on: ["ubuntu-24.04"]
    timeout-minutes: 20
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2  # v4.0.0
        with:
          version: 9
          run_install: false
      - name: "Setup node"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 21
          cache: "pnpm"
          cache-dependency-path: "airflow-core/src/airflow/**/pnpm-lock.yaml"
      # One Vitest run: full test suite + coverage only for anomaly UI paths (see coverage.include).
      # HTML is uploaded as a workflow artifact; text-summary prints a short table in the job log.
      - name: "Install and run main UI tests (with scoped coverage)"
        working-directory: airflow-core/src/airflow/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run --coverage \
            --coverage.include="src/pages/AnomalyDashboard/**" \
            --coverage.include="src/pages/Dag/Anomalies/**" \
            --coverage.reporter=html \
            --coverage.reporter=text-summary \
            --coverage.reportsDirectory=coverage/ui-anomaly
      - name: "Upload scoped UI coverage (HTML)"
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ui-anomaly-coverage
          path: airflow-core/src/airflow/ui/coverage/ui-anomaly
          if-no-files-found: warn
      - name: "Install and run simple auth manager UI tests"
        working-directory: airflow-core/src/airflow/api_fastapi/auth/managers/simple/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
